[package]
name = "rfengine"
version = "0.1.0"
edition = "2024"
description = "Render Fox: a live CPU renderer that streams a Minecraft server around the clock"
license = "GPL-3.0-or-later"
repository = "https://github.com/Experimentiale-Developments/RenderFox"
publish = false

# Exact versions, each published at least 7 days before it was added.
[dependencies]
ab_glyph = "=0.2.32"
ab_glyph_rasterizer = "=0.1.10"
# Checks the observer's signed hello; verification only, so no precomputed tables.
ed25519-dalek = { version = "=3.0.0", default-features = false }
miniz_oxide = "=0.9.1"
png = "=0.18.1"
serde_json = "=1.0.151"
# Pairing's HMAC. Already locked as ed25519-dalek's own dependency.
sha2 = { version = "=0.11.0", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1
