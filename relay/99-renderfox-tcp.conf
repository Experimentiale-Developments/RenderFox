# Render Fox: notice a dead ingest connection (no RST or FIN ever arrives) within about
# 19 seconds instead of two hours, so the uplink restarts. Applies to every TCP socket
# that asks for keepalives on this machine; install.sh puts it in /etc/sysctl.d.
net.ipv4.tcp_keepalive_time = 10
net.ipv4.tcp_keepalive_intvl = 3
net.ipv4.tcp_keepalive_probes = 3
